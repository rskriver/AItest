<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Rotating Navbar</title>
  <style>
    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navbar Container */
    .nav-3d {
      display: flex;
      gap: 15px;
    }

    /* Individual 3D Perspective Scene */
    .scene {
      width: 120px;
      height: 45px;
      perspective: 600px;
    }

    /* Rotating Box */
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease-in-out;
    }

    /* Rotate -90deg on Mouseover */
    .scene:hover .cube {
      transform: rotateX(-90deg);
    }

    /* Common Styles for Box Faces */
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
      border-radius: 4px;
      box-sizing: border-box;
    }

    /* Front Face (Default State) */
    .face-front {
      background-color: #2c3e50;
      transform: translateZ(22.5px);
    }

    /* Bottom Face (Revealed on Hover) */
    .face-bottom {
      background-color: #e74c3c;
      transform: rotateX(-90deg) translateZ(-22.5px);
    }
  </style>
</head>
<body>

  <nav class="nav-3d">
    <div class="scene">
      <div class="cube">
        <a href="#" class="face face-front">Home</a>
        <a href="#" class="face face-bottom">Go Home</a>
      </div>
    </div>

    <div class="scene">
      <div class="cube">
        <a href="#" class="face face-front">About</a>
        <a href="#" class="face face-bottom">Who We Are</a>
      </div>
    </div>

    <div class="scene">
      <div class="cube">
        <a href="#" class="face face-front">Services</a>
        <a href="#" class="face face-bottom">What We Do</a>
      </div>
    </div>

    <div class="scene">
      <div class="cube">
        <a href="#" class="face face-front">Contact</a>
        <a href="#" class="face face-bottom">Say Hello</a>
      </div>
    </div>
  </nav>

</body>
</html>
